<title>Tally Tracker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column (max 640px); sticky date header, prompt bar, today list; tab bar fixed to the bottom on phones, top row on wide screens. */
:root {
  --bg: #F3F5F1; --surface: #FFFFFF; --surface-2: #E8EDE7; --line: #D5DCD4;
  --fg: #16201B; --muted: #5C6962; --accent: var(--ua-l, #2E6B57); --accent-ink: #FFFFFF;
  --flame: #C9701C; --danger: #B83A3A; --shadow: 0 1px 2px rgba(20,32,27,.06), 0 6px 20px rgba(20,32,27,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1311; --surface: #171E1B; --surface-2: #202925; --line: #2C3732;
  --fg: #E6ECE8; --muted: #93A199; --accent: var(--ua-d, #72C3A5); --accent-ink: #0E1311;
  --flame: #F0A24F; --danger: #F07A7A; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #171E1B; --surface-2: #202925; --line: #2C3732;
  --fg: #E6ECE8; --muted: #93A199; --accent: var(--ua-d, #72C3A5); --accent-ink: #0E1311;
  --flame: #F0A24F; --danger: #F07A7A; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.num { font-variant-numeric: tabular-nums }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 112px }
@media (min-width: 760px) { .wrap { padding-block: 0 48px } }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.tabs button { flex: 1; max-width: 140px; border: 0; background: none; padding: 6px 4px; border-radius: 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted) }
.tabs button svg { width: 22px; height: 22px }
.tabs button[aria-current="true"] { color: var(--accent); background: var(--surface-2) }
@media (min-width: 760px) {
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-top: 8px; padding-bottom: 8px }
  .tabs button { grid-auto-flow: column; gap: 8px; font-size: 14px; padding: 8px 12px }
  .tabs button svg { width: 18px; height: 18px }
}

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px 12px }
.head .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.head h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; line-height: 1.05 }
.daynav { display: flex; align-items: center; gap: 6px; margin-top: 6px }
.daynav button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted) }
.ring { flex: none; position: relative; width: 72px; height: 72px }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.1 }
.ring .lbl small { display: block; font-weight: 500; font-size: 11px; color: var(--muted) }

/* prompt bar */
.prompt { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); align-items: center }
.prompt input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 8px 0; font-size: 16px }
.prompt .go { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 11px; padding: 9px 14px; font-weight: 700; white-space: nowrap }
.hint { font-size: 13px; color: var(--muted); margin: 8px 2px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--fg) }
.preview { margin-top: 10px; background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px }
.preview .what { display: flex; gap: 10px; align-items: center; font-weight: 600 }
.preview .tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface); color: var(--muted) }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent }
.btn.danger { color: var(--danger) }
.btn.small { padding: 5px 10px; font-size: 13px }

.banner { margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; color: var(--muted) }

/* list */
.sec { margin-top: 22px }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px }
.sec-h h2 { font-size: 13px; font-family: var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.sec-h button { border: 0; background: none; color: var(--muted); font-size: 13px }
.list { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); border: 1px solid transparent }
.item.done { opacity: .62; box-shadow: none; border-color: var(--line); background: transparent }
.item.done .name { text-decoration: line-through; text-decoration-color: var(--muted) }
.check { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--c); background: transparent; display: grid; place-items: center; position: relative; padding: 0; color: #fff }
.check svg { width: 20px; height: 20px; opacity: 0; transform: scale(.6); transition: .18s }
.check.on { background: var(--c) }
.check.on svg { opacity: 1; transform: none }
.check .pie { position: absolute; inset: -2.5px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px) }
.check .emo { font-size: 17px; line-height: 1 }
.body { min-width: 0; cursor: pointer }
.name { font-weight: 600; overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 1px }
.meta .fl { color: var(--flame); font-weight: 700 }
.meta .late { color: var(--danger); font-weight: 600 }
.counter { display: flex; align-items: center; gap: 2px }
.counter button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; font-weight: 600 }
.counter .v { min-width: 54px; text-align: center; font-weight: 700; font-size: 14px; border: 0; background: none; border-radius: 6px; padding: 4px 2px }
.counter .v small { display: block; font-weight: 500; font-size: 11px; color: var(--muted) }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: var(--r) }

/* stats */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow) }
.tile b { display: block; font: 800 26px/1.1 var(--f-display) }
.tile span { font-size: 12px; color: var(--muted) }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow) }
.card h3 { font-size: 17px }
.chart { width: 100%; height: auto; display: block; margin-top: 8px }
.chart text { fill: var(--muted); font: 11px var(--f-body) }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.tstat { display: grid; gap: 10px }
.tstat .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }
.tstat .nums { display: flex; gap: 14px; font-size: 13px; color: var(--muted) }
.tstat .nums b { color: var(--fg) }
.heat { overflow-x: auto }
.heat svg { display: block }

/* manage */
.mrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow) }
.dot { width: 34px; height: 34px; border-radius: 10px; background: var(--c); display: grid; place-items: center; font-size: 17px }
.mrow .acts { display: flex; gap: 4px }
.icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; display: grid; place-items: center; padding: 0; color: var(--muted) }
.icon-btn svg { width: 16px; height: 16px }

/* settings */
.set { display: grid; gap: 10px }
.set .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px }
.seg button { border: 0; background: none; border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow) }
.swatches { display: flex; gap: 8px; flex-wrap: wrap }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--c); padding: 0 }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg) }
textarea.data { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px; font: 12px ui-monospace, Menlo, monospace }
.muted { color: var(--muted); font-size: 13px }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,10,.45); display: flex; align-items: flex-end; justify-content: center }
@media (min-width: 640px) { .scrim { align-items: center } }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
@media (min-width: 640px) { .sheet { border-radius: 20px } }
.sheet h2 { font-size: 22px; margin-bottom: 12px }
.field { display: grid; gap: 5px; margin-bottom: 12px }
.field > label, .field > .l { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 9px 11px; font-size: 16px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.days { display: flex; gap: 5px; flex-wrap: wrap }
.days button { width: 40px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent }
.emopick { display: flex; gap: 4px; flex-wrap: wrap }
.emopick button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; padding: 0 }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg);
  padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px) }
.toast button { border: 0; background: none; color: var(--bg); text-decoration: underline; font-weight: 700 }
@media (min-width: 760px) { .toast { bottom: 24px } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<script>
(() => {
"use strict";
// ---------- storage ----------
const KEY = "tally.v1";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const COLORS = ["#2E8B6F", "#3C7DD9", "#8A5CD6", "#D2557A", "#D9822B", "#B8931A", "#3E9EA0", "#6E8B2F", "#7D7D8C"];
const ACCENTS = { pine: ["#2E6B57", "#72C3A5"], ocean: ["#245FA8", "#7EB0F0"], plum: ["#6D3FB0", "#B99AF0"], rose: ["#A83A5C", "#F08FAE"], amber: ["#9A5A12", "#F0B060"], slate: ["#3E4A57", "#AEB9C6"] };
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d) };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const diffDays = (a, b) => Math.round((fromKey(keyOf(a)) - fromKey(keyOf(b))) / 864e5);
const weekStart = (d, ws) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() - ws + 7) % 7)); return x };
const fmtTime = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); const am = h < 12; return `${((h + 11) % 12) + 1}:${pad(m)} ${am ? "AM" : "PM"}` };
const fmtDate = d => d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
const fmtShort = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

// ---------- state ----------
let S = store.get(KEY, null);
const defaults = () => ({ trackers: [], log: {}, fired: {}, examples: false, settings: { theme: "system", accent: "pine", weekStart: 1, notify: false, showDone: true } });
if (!S) { S = defaults(); seedExamples(); }
S.settings = Object.assign(defaults().settings, S.settings || {});
S.fired = S.fired || {};
const save = () => store.set(KEY, S);
let ui = { tab: "today", day: keyOf(today()), draft: null, doneOpen: true };

function seedExamples() {
  const mk = (o) => Object.assign({ id: uid(), emoji: "✅", color: COLORS[0], kind: "check", target: 1, unit: "", freq: "daily", days: [], perWeek: 3, due: null, reminder: null, category: "", notes: "", archived: false, example: true, created: keyOf(addDays(today(), -60)) }, o);
  const t = [
    mk({ name: "Drink water", emoji: "💧", color: COLORS[1], kind: "count", target: 8, unit: "glasses", reminder: "09:00", category: "Health" }),
    mk({ name: "Read", emoji: "📖", color: COLORS[2], kind: "count", target: 20, unit: "pages", reminder: "21:30", category: "Mind" }),
    mk({ name: "Gym", emoji: "🏋️", color: COLORS[4], freq: "weekly", perWeek: 3, category: "Health" }),
    mk({ name: "Meditate", emoji: "🧘", color: COLORS[0], freq: "days", days: [1, 2, 3, 4, 5], reminder: "07:30", category: "Mind" }),
    mk({ name: "Call mom", emoji: "📞", color: COLORS[3], freq: "once", due: keyOf(addDays(today(), 1)), category: "" })
  ];
  S.trackers = t; S.examples = true;
  // plausible history so charts have something to show
  let seed = 7; const rnd = () => (seed = (seed * 9301 + 49297) % 233280) / 233280;
  for (let i = 1; i <= 56; i++) {
    const d = addDays(today(), -i), k = keyOf(d);
    t.forEach(tr => {
      if (tr.freq === "once") return;
      if (!isDue(tr, d)) return;
      const p = tr.freq === "weekly" ? 0.45 : 0.8 - (i > 30 ? 0.15 : 0);
      if (rnd() < p) (S.log[tr.id] ||= {})[k] = tr.target;
      else if (tr.kind === "count" && rnd() < .6) (S.log[tr.id] ||= {})[k] = Math.floor(tr.target * rnd());
    });
  }
  (S.log[t[0].id] ||= {})[keyOf(today())] = 3;
}

// ---------- tracker logic ----------
const cnt = (t, k) => (S.log[t.id] && S.log[t.id][k]) || 0;
const doneOn = (t, k) => cnt(t, k) >= t.target;
function isDue(t, d) {
  const k = keyOf(d);
  if (t.created && k < t.created && t.freq !== "once") return false;
  if (t.freq === "daily" || t.freq === "weekly") return true;
  if (t.freq === "days") return t.days.includes(d.getDay());
  if (t.freq === "once") {
    if (!t.due) return k === keyOf(today());
    const doneK = Object.keys(S.log[t.id] || {}).find(x => doneOn(t, x));
    if (doneK) return k === doneK;
    return k >= t.due && k <= keyOf(today()) ? k === keyOf(today()) || k === t.due : k === t.due;
  }
  return true;
}
function weekCount(t, d) {
  const ws = weekStart(d, S.settings.weekStart); let n = 0;
  for (let i = 0; i < 7; i++) if (doneOn(t, keyOf(addDays(ws, i)))) n++;
  return n;
}
function streak(t) {
  const now = today();
  if (t.freq === "once") return { cur: 0, best: 0 };
  if (t.freq === "weekly") {
    const ws = weekStart(now, S.settings.weekStart);
    const met = i => weekCount(t, addDays(ws, -7 * i)) >= t.perWeek;
    let cur = 0, best = 0, run = 0;
    for (let i = met(0) ? 0 : 1; i < 60 && met(i); i++) cur++;
    for (let i = 0; i < 60; i++) { if (met(i)) { run++; best = Math.max(best, run) } else run = 0 }
    return { cur, best: Math.max(best, cur) };
  }
  let cur = 0, best = 0, run = 0, counting = true;
  for (let i = 0; i < 400; i++) {
    const d = addDays(now, -i), k = keyOf(d);
    if (t.created && k < t.created) break;
    if (!isDue(t, d)) continue;
    if (doneOn(t, k)) { run++; if (counting) cur = run }
    else { if (i === 0) continue; counting = false; best = Math.max(best, run); run = 0 }
  }
  return { cur, best: Math.max(best, run, cur) };
}
function rate(t, days) {
  let due = 0, done = 0;
  for (let i = 0; i < days; i++) {
    const d = addDays(today(), -i), k = keyOf(d);
    if (!isDue(t, d) || t.freq === "weekly") continue;
    due++; if (doneOn(t, k)) done++;
  }
  if (t.freq === "weekly") { let w = 0, m = 0; for (let i = 0; i < Math.ceil(days / 7); i++) { w++; if (weekCount(t, addDays(today(), -7 * i)) >= t.perWeek) m++ } return w ? m / w : 0 }
  return due ? done / due : 0;
}
const active = () => S.trackers.filter(t => !t.archived);
function dueList(d) {
  const k = keyOf(d), isToday = k === keyOf(today());
  return active().filter(t => {
    if (t.freq === "once") {
      if (!t.due) return isDue(t, d);
      const doneK = Object.keys(S.log[t.id] || {}).find(x => doneOn(t, x));
      if (doneK) return doneK === k;
      return isToday ? t.due <= k : t.due === k;
    }
    return isDue(t, d);
  });
}
function schedText(t) {
  const amt = t.kind === "count" ? `${t.target}${t.unit ? " " + t.unit : "×"} ` : "";
  if (t.freq === "daily") return amt + "every day";
  if (t.freq === "weekly") return `${t.perWeek}× a week` + (t.kind === "count" ? ` · ${t.target} ${t.unit || ""} each` : "");
  if (t.freq === "days") {
    const s = [...t.days].sort().join("");
    const label = s === "12345" ? "weekdays" : s === "06" ? "weekends" : t.days.slice().sort((a, b) => ((a + 6) % 7) - ((b + 6) % 7)).map(i => DOW[i]).join(", ");
    return amt + label;
  }
  if (t.freq === "once") return amt + (t.due ? "on " + fmtShort(fromKey(t.due)) : "one time");
  return "";
}

function setCount(t, k, v) {
  v = Math.max(0, Math.min(v, t.kind === "count" ? 999999 : 1));
  (S.log[t.id] ||= {});

  [/study|learn|lesson|course|homework/, "📚"], [/code|program/, "💻"], [/write|journal|diary/, "✍️"], [/guitar|piano|music|practice/, "🎸"], [/language|spanish|french|english|japanese|korean|duolingo/, "🗣️"],
  [/pay|bill|rent|bank|money|budget|save/, "💸"], [/plant|garden/, "🪴"], [/dog|cat|pet/, "🐾"], [/teeth|floss|brush/, "🪥"], [/email|inbox/, "📧"], [/shop|grocer|buy/, "🛒"], [/no sugar|sugar|soda|smok|alcohol/, "🚫"], [/pray|church|mosque/, "🙏"]];

function barChart(vals, labels) {

// ---------- reminders ----------
function checkReminders() {
  const now = new Date(), k = keyOf(now), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  dueList(today()).forEach(t => {
    if (!t.reminder || t.reminder > hm || S.fired[t.id] === k || doneOn(t, k)) return;
    S.fired[t.id] = k; save();
    const body = t.kind === "count" ? `${cnt(t, k)} of ${t.target} ${t.unit} so far` : "Tap to check it off";
    let shown = false;
    if (S.settings.notify && "Notification" in window && Notification.permission === "granted") {
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(`${t.emoji} ${t.name}`, { body, tag: t.id, icon: "icon-192.png" }));
        else new Notification(`${t.emoji} ${t.name}`, { body, tag: t.id });
        shown = true;
      } catch { }
    }
    if (!shown || document.visibilityState === "visible") toast(`⏰ ${t.emoji} ${t.name}`);
  });
}
setInterval(checkReminders, 20000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { checkReminders(); if (ui.day !== keyOf(today()) && ui.tab === "today" && !layer.innerHTML) { } render() } });

// ---------- boot ----------
applyTheme(); render(); setTimeout(checkReminders, 1500);
try { if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol) && window.top === window.self) navigator.serviceWorker.register("sw.js").catch(() => { }) } catch { }
})();
</script>
