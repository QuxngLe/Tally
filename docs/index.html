<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tally">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">

<title>Tally Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column (max 640px); sticky date header, prompt bar, today list; tab bar fixed to the bottom on phones, top row on wide screens. */
:root {
  --bg: #F3F5F1; --surface: #FFFFFF; --surface-2: #E8EDE7; --line: #D5DCD4;
  --fg: #16201B; --muted: #5C6962; --accent: #2E6B57; --accent-ink: #FFFFFF;
  --flame: #C9701C; --danger: #B83A3A; --shadow: 0 1px 2px rgba(20,32,27,.06), 0 6px 20px rgba(20,32,27,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1311; --surface: #171E1B; --surface-2: #202925; --line: #2C3732;
  --fg: #E6ECE8; --muted: #93A199; --accent: #72C3A5; --accent-ink: #0E1311;
  --flame: #F0A24F; --danger: #F07A7A; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #171E1B; --surface-2: #202925; --line: #2C3732;
  --fg: #E6ECE8; --muted: #93A199; --accent: #72C3A5; --accent-ink: #0E1311;
  --flame: #F0A24F; --danger: #F07A7A; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100% }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.num { font-variant-numeric: tabular-nums }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 112px }
@media (min-width: 760px) { .wrap { padding-block: 0 48px } }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.tabs button { flex: 1; max-width: 140px; border: 0; background: none; padding: 6px 4px; border-radius: 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted) }
.tabs button svg { width: 22px; height: 22px }
.tabs button[aria-current="true"] { color: var(--accent); background: var(--surface-2) }
@media (min-width: 760px) {
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-top: 8px; padding-bottom: 8px }
  .tabs button { grid-auto-flow: column; gap: 8px; font-size: 14px; padding: 8px 12px }
  .tabs button svg { width: 18px; height: 18px }
}

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px 12px }
.head .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.head h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; line-height: 1.05 }
.daynav { display: flex; align-items: center; gap: 6px; margin-top: 6px }
.daynav button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted) }
.ring { flex: none; position: relative; width: 72px; height: 72px }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.1 }
.ring .lbl small { display: block; font-weight: 500; font-size: 11px; color: var(--muted) }

/* prompt bar */
.prompt { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); align-items: center }
.prompt input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 8px 0; font-size: 16px }
.prompt .go { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 11px; padding: 9px 14px; font-weight: 700; white-space: nowrap }
.hint { font-size: 13px; color: var(--muted); margin: 8px 2px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--fg) }
.preview { margin-top: 10px; background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px }
.preview .what { display: flex; gap: 10px; align-items: center; font-weight: 600 }
.preview .tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface); color: var(--muted) }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent }
.btn.danger { color: var(--danger) }
.btn.small { padding: 5px 10px; font-size: 13px }

.banner { margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; color: var(--muted) }

/* list */
.sec { margin-top: 22px }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px }
.sec-h h2 { font-size: 13px; font-family: var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.sec-h button { border: 0; background: none; color: var(--muted); font-size: 13px }
.list { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); border: 1px solid transparent }
.item.done { opacity: .62; box-shadow: none; border-color: var(--line); background: transparent }
.item.done .name { text-decoration: line-through; text-decoration-color: var(--muted) }
.check { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--c); background: transparent; display: grid; place-items: center; position: relative; padding: 0; color: #fff }
.check svg { width: 20px; height: 20px; opacity: 0; transform: scale(.6); transition: .18s }
.check.on { background: var(--c) }
.check.on svg { opacity: 1; transform: none }
.check .pie { position: absolute; inset: -2.5px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px) }
.check .emo { font-size: 17px; line-height: 1 }
.body { min-width: 0; cursor: pointer }
.name { font-weight: 600; overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 1px }
.meta .fl { color: var(--flame); font-weight: 700 }
.meta .late { color: var(--danger); font-weight: 600 }
.counter { display: flex; align-items: center; gap: 2px }
.counter button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; font-weight: 600 }
.counter .v { min-width: 54px; text-align: center; font-weight: 700; font-size: 14px; border: 0; background: none; border-radius: 6px; padding: 4px 2px }
.counter .v small { display: block; font-weight: 500; font-size: 11px; color: var(--muted) }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: var(--r) }

/* stats */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow) }
.tile b { display: block; font: 800 26px/1.1 var(--f-display) }
.tile span { font-size: 12px; color: var(--muted) }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow) }
.card h3 { font-size: 17px }
.chart { width: 100%; height: auto; display: block; margin-top: 8px }
.chart text { fill: var(--muted); font: 11px var(--f-body) }
.chart .grid { stroke: var(--line); stroke-width: 1 }
.tstat { display: grid; gap: 10px }
.tstat .top { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap }
.tstat .nums { display: flex; gap: 14px; font-size: 13px; color: var(--muted) }
.tstat .nums b { color: var(--fg) }
.heat { overflow-x: auto }
.heat svg { display: block }

/* manage */
.mrow { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow) }
.dot { width: 34px; height: 34px; border-radius: 10px; background: var(--c); display: grid; place-items: center; font-size: 17px }
.mrow .acts { display: flex; gap: 4px }
.icon-btn { width: 32px; height: 32px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px; display: grid; place-items: center; padding: 0; color: var(--muted) }
.icon-btn svg { width: 16px; height: 16px }

/* settings */
.set { display: grid; gap: 10px }
.set .line { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap }
.seg { display: inline-flex; background: var(--surface-2); border-radius: 10px; padding: 3px; gap: 2px }
.seg button { border: 0; background: none; border-radius: 8px; padding: 5px 12px; font-weight: 600; font-size: 13px; color: var(--muted) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow) }
.swatches { display: flex; gap: 8px; flex-wrap: wrap }
.sw { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--surface); box-shadow: 0 0 0 1px var(--line); background: var(--c); padding: 0 }
.sw[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--fg) }
textarea.data { width: 100%; min-height: 110px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 8px; font: 12px ui-monospace, Menlo, monospace }
.muted { color: var(--muted); font-size: 13px }

/* sheet */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(8,12,10,.45); display: flex; align-items: flex-end; justify-content: center }
@media (min-width: 640px) { .scrim { align-items: center } }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92%; overflow: auto; border-radius: 20px 20px 0 0;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)) }
@media (min-width: 640px) { .sheet { border-radius: 20px } }
.sheet h2 { font-size: 22px; margin-bottom: 12px }
.field { display: grid; gap: 5px; margin-bottom: 12px }
.field > label, .field > .l { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted) }
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=time], .field select, .field textarea {
  width: 100%; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 9px 11px; font-size: 16px }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px }
.days { display: flex; gap: 5px; flex-wrap: wrap }
.days button { width: 40px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: 13px }
.days button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent }
.emopick { display: flex; gap: 4px; flex-wrap: wrap }
.emopick button { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; padding: 0 }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); z-index: 60; background: var(--fg); color: var(--bg);
  padding: 10px 14px; border-radius: 12px; font-weight: 600; font-size: 14px; display: flex; gap: 12px; align-items: center; max-width: calc(100% - 32px) }
.toast button { border: 0; background: none; color: var(--bg); text-decoration: underline; font-weight: 700 }
@media (min-width: 760px) { .toast { bottom: 24px } }
/* appearance options */
#bgimg { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-size: cover; background-position: center }
#bgimg::after { content: ""; position: absolute; inset: 0; background: var(--bg); opacity: var(--bg-dim, .3) }
.wrap { position: relative; z-index: 1; zoom: var(--zoom, 1) }
.tabs { zoom: var(--zoom, 1) }
body.glass .item:not(.done), body.glass .tile, body.glass .card, body.glass .mrow, body.glass .prompt, body.glass .banner, body.glass .empty, body.glass .tabs { background: color-mix(in srgb, var(--surface) 58%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px) }
body.glass .item.done { background: color-mix(in srgb, var(--surface) 35%, transparent) }
.crop { position: relative; overflow: hidden; margin: 0 auto; border-radius: 14px; background: var(--surface-2); touch-action: none; cursor: grab; max-width: 100% }
.crop img { position: absolute; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none }
body.compact .list { gap: 5px }
body.compact .item, body.compact .mrow { padding: 6px 10px }
body.compact .check { width: 34px; height: 34px }
body.compact .check .pie { -webkit-mask: radial-gradient(circle, transparent 10px, #000 11px); mask: radial-gradient(circle, transparent 10px, #000 11px) }
body.square .check, body.square .check .pie { border-radius: 28% }
body.square .check .pie { -webkit-mask: none; mask: none; opacity: .35 }
body.no-streak .fl { display: none }
.list.grid { grid-template-columns: repeat(2, minmax(0, 1fr)) }
.list.grid .item { grid-template-columns: auto minmax(0, 1fr); align-content: start }
.list.grid .item > span:last-child { display: none }
.list.grid .counter { grid-column: 1 / -1; justify-content: space-between }
.themes { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px }
.theme { border: 2px solid var(--line); border-radius: 12px; padding: 0; overflow: hidden; background: var(--tb); text-align: left }
.theme[aria-pressed="true"] { border-color: var(--fg) }
.theme .tv { display: grid; gap: 4px; padding: 8px }
.theme .tv i { display: block; height: 9px; border-radius: 4px; background: var(--ts) }
.theme .tv i:first-child { width: 60%; background: var(--ta) }
.theme b { display: block; padding: 4px 8px 6px; font-size: 12px; color: var(--tf); background: var(--ts) }
.bgs { display: flex; gap: 8px; flex-wrap: wrap }
.bgs button, .bgs label { width: 56px; height: 56px; border-radius: 12px; border: 2px solid var(--line); background: var(--g); background-size: cover; background-position: center; padding: 0; font-size: 11px; font-weight: 700; color: var(--muted); display: grid; place-items: center; cursor: pointer }
.bgs [aria-pressed="true"] { border-color: var(--fg) }
.colors { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px }
.colors label { display: flex; align-items: center; gap: 8px; font-size: 13px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; background: var(--surface) }
input[type=color] { width: 30px; height: 30px; border: 0; padding: 0; background: none; border-radius: 8px; cursor: pointer }
input[type=range] { width: min(220px, 100%); accent-color: var(--accent) }
.set input[type=text] { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 7px 10px; font-size: 15px; width: min(220px, 100%) }
.set .sub { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-top: 6px }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important } }
</style>

<main class="wrap" id="view"></main>

<script>
(() => {
"use strict";
// ---------- storage ----------
const KEY = "tally.v1";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} }
};
const COLORS = ["#2E8B6F", "#3C7DD9", "#8A5CD6", "#D2557A", "#D9822B", "#B8931A", "#3E9EA0", "#6E8B2F", "#7D7D8C"];
const DOW = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---------- dates ----------
const pad = n => String(n).padStart(2, "0");
const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const fromKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d) };
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x };
const today = () => { const d = new Date(); d.setHours(0, 0, 0, 0); return d };
const diffDays = (a, b) => Math.round((fromKey(keyOf(a)) - fromKey(keyOf(b))) / 864e5);
const weekStart = (d, ws) => { const x = new Date(d); x.setHours(0, 0, 0, 0); x.setDate(x.getDate() - ((x.getDay() - ws + 7) % 7)); return x };
const fmtTime = t => { if (!t) return ""; const [h, m] = t.split(":").map(Number); const am = h < 12; return `${((h + 11) % 12) + 1}:${pad(m)} ${am ? "AM" : "PM"}` };
const fmtDate = d => d.toLocaleDateString(undefined, { weekday: "long", month: "short", day: "numeric" });
const fmtShort = d => d.toLocaleDateString(undefined, { month: "short", day: "numeric" });

// ---------- state ----------
let S = store.get(KEY, null);
const defaultLook = () => ({ preset: "pine", accent: "", custom: { bg: "#F3F5F1", surface: "#FFFFFF", fg: "#16201B", accent: "#2E6B57" }, bg: "none", dim: 0.4, glass: true, font: "modern", size: 1, radius: 14, density: "comfy", layout: "list", check: "circle", streaks: true, title: "Tally" });
const defaults = () => ({ trackers: [], log: {}, fired: {}, examples: false, settings: { theme: "system", weekStart: 1, notify: false, showDone: true, look: defaultLook() } });
function fixSettings() {
  const st = fixSettings();
  if (st.accent) { st.look.preset = { ocean: "ocean", plum: "lavender", rose: "sakura", amber: "sand", slate: "mono" }[st.accent] || st.look.preset; delete st.accent }
  st.look = Object.assign(defaultLook(), st.look || {}); st.look.custom = Object.assign(defaultLook().custom, st.look.custom || {});
  // app name, corners and spacing are no longer offered, so they stay at their defaults
  const d = defaultLook(); ["radius", "density", "title"].forEach(k => st.look[k] = d[k]);
}
if (!S) { S = defaults(); seedExamples(); }
S.settings = Object.assign(defaults().settings, S.settings || {});
S.fired = S.fired || {};
const save = () => store.set(KEY, S);
let ui = { adv: false, tab: "today", day: keyOf(today()), draft: null, doneOpen: true };

function seedExamples() {
  const mk = (o) => Object.assign({ id: uid(), emoji: "✅", color: COLORS[0], kind: "check", target: 1, unit: "", freq: "daily", days: [], perWeek: 3, due: null, reminder: null, category: "", notes: "", archived: false, example: true, created: keyOf(addDays(today(), -60)) }, o);
  const t = [
    mk({ name: "Drink water", emoji: "💧", color: COLORS[1], kind: "count", target: 8, unit: "glasses", reminder: "09:00", category: "Health" }),
    mk({ name: "Read", emoji: "📖", color: COLORS[2], kind: "count", target: 20, unit: "pages", reminder: "21:30", category: "Mind" }),
    mk({ name: "Gym", emoji: "🏋️", color: COLORS[4], freq: "weekly", perWeek: 3, category: "Health" }),
    mk({ name: "Meditate", emoji: "🧘", color: COLORS[0], freq: "days", days: [1, 2, 3, 4, 5], reminder: "07:30", category: "Mind" }),
    mk({ name: "Call mom", emoji: "📞", color: COLORS[3], freq: "once", due: keyOf(addDays(today(), 1)), category: "" })
  ];

    <div class="row-btns"><button class="btn primary" data-cr="use">Use photo</button><button class="btn" data-cr="fit">Center</button><button class="btn" data-cr="cancel">Cancel</button></div>

// ---------- editor sheet ----------
const EMOJIS = ["✅", "💧", "📖", "🏋️", "🏃", "🧘", "😴", "💊", "🍎", "📚", "✍️", "💻", "🎸", "🧹", "💸", "📞", "🪴", "🐾", "🪥", "🙏", "🚫", "⭐"];
function openEditor(t, isNew) {
  const e = JSON.parse(JSON.stringify(t));
  const cats = [...new Set(S.trackers.map(x => x.category).filter(Boolean))];
  const draw = () => {
    layer.innerHTML = `<div class="scrim" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="edh">

    <div class="two"><div class="field"><label for="f-rem">Reminder</label><input id="f-rem" type="time" value="${e.reminder || ""}"></div>
    <div class="field"><label for="f-cat">Group</label><input id="f-cat" type="text" list="cats" value="${esc(e.category)}" placeholder="Health, Work…"><datalist id="cats">${cats.map(c => `<option value="${esc(c)}">`).join("")}</datalist></div></div>
    <div class="field"><label for="f-notes">Notes</label><textarea id="f-notes" rows="2">${esc(e.notes)}</textarea></div>
    <div class="row-btns" style="justify-content:space-between"><div class="row-btns"><button class="btn primary" data-ed="save">Save</button><button class="btn" data-ed="cancel">Cancel</button></div>
    ${isNew ? "" : `<div class="row-btns"><button class="btn" data-ed="archive">${e.archived ? "Restore" : "Archive"}</button><button class="btn danger" data-ed="delete">Delete</button></div>`}</div>
    <div id="confirm"></div>
    </div></div>`;
  };
  const grab = () => {
    const v = id => { const el = document.getElementById(id); return el ? el.value : null };
    e.name = v("f-name") ?? e.name; e.emoji = (v("f-emoji") || e.emoji).trim() || "✅";
    if (v("f-target") != null) e.target = Math.max(1, parseFloat(v("f-target")) || 1);
    if (v("f-unit") != null) e.unit = v("f-unit").trim();

    if (v("f-due") != null) e.due = v("f-due") || null;
    e.reminder = v("f-rem") || null; e.category = (v("f-cat") || "").trim(); e.notes = v("f-notes") || "";
  };
  draw();
  layer.onclick = ev => {
    const b = ev.target.closest("[data-ed]");

    else if (a === "freq") { e.freq = val; if (val === "days" && !e.days.length) e.days = [1, 2, 3, 4, 5]; if (val === "once" && !e.due) e.due = keyOf(today()) }

      if (i >= 0) S.trackers[i] = e; else S.trackers.push(e);
      save(); closeSheet(); toast(isNew ? `Added “${e.name}”` : "Saved"); return;
    }
    else if (a === "archive") { e.archived = !e.archived; const i = S.trackers.findIndex(x => x.id === e.id); S.trackers[i] = e; save(); closeSheet(); toast(e.archived ? "Archived" : "Restored"); return }
    else if (a === "delete") { document.getElementById("confirm").innerHTML = `<div class="banner"><span>Delete “${esc(e.name)}” and its history?</span><span class="row-btns"><button class="btn small danger" data-ed="delete2">Delete</button><button class="btn small" data-ed="nodel">Keep</button></span></div>`; return }
    else if (a === "nodel") { document.getElementById("confirm").innerHTML = ""; return }
    else if (a === "delete2") { removeTracker(e.id); closeSheet(); return }
    draw();
  };
}
function closeSheet() { layer.innerHTML = ""; layer.onclick = null; render() }
function removeTracker(id) {
  const i = S.trackers.findIndex(x => x.id === id); if (i < 0) return;
  const t = S.trackers[i], l = S.log[id];
  S.trackers.splice(i, 1); delete S.log[id]; save(); render();
  toast(`Deleted “${t.name}”`, "Undo", () => { S.trackers.splice(i, 0, t); if (l) S.log[id] = l; save(); render() });
}
function openDetail(t) {
  const s = streak(t);

   <div style="display:flex;gap:12px;align-items:center;margin-bottom:10px"><span class="dot" style="--c:${t.color}">${esc(t.emoji)}</span><div><h2 id="dth" style="margin:0">${esc(t.name)}</h2><div class="muted">${esc(schedText(t))}${t.reminder ? " · ⏰ " + fmtTime(t.reminder) : ""}</div></div></div>
   ${t.freq !== "once" ? `<div class="tiles" style="grid-template-columns:repeat(3,minmax(0,1fr))"><div class="tile"><b class="num" style="color:var(--flame)">${s.cur}</b><span>current streak</span></div><div class="tile"><b class="num">${s.best}</b><span>best streak</span></div><div class="tile"><b class="num">${Math.round(rate(t, 30) * 100)}%</b><span>last 30 days</span></div></div><div class="sec">${heatmap(t)}</div>` : ""}
   ${t.notes ? `<p>${esc(t.notes)}</p>` : ""}
   <div class="row-btns" style="margin-top:16px"><button class="btn primary" data-dt="edit">Edit</button><button class="btn" data-dt="close">Close</button></div></div></div>`;
  layer.onclick = ev => {
    const b = ev.target.closest("[data-dt]");

  };
}
function blankTracker(o = {}) { return Object.assign({ id: uid(), name: "", emoji: "✅", color: COLORS[0], kind: "check", target: 1, unit: "", freq: "daily", days: [], perWeek: 3, due: null, reminder: null, category: "", notes: "", archived: false, created: keyOf(today()) }, o) }

// ---------- toast ----------
let toastTimer;
function toast(msg, label, fn) {
  clearTimeout(toastTimer);
  let el = document.getElementById("toast"); if (!el) { el = document.createElement("div"); el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el) }
  el.innerHTML = `<span>${esc(msg)}</span>${label ? `<button>${esc(label)}</button>` : ""}`;
  if (label) el.querySelector("button").onclick = () => { fn(); el.remove() };
  toastTimer = setTimeout(() => el.remove(), label ? 6000 : 2600);
}

// ---------- events ----------
document.addEventListener("click", async ev => {
  const tab = ev.target.closest("[data-tab]");
  if (tab) { goTab(tab.dataset.tab); return }
  const b = ev.target.closest("[data-act]"); if (!b || layer.contains(b)) return;
  const a = b.dataset.act, t = S.trackers.find(x => x.id === b.dataset.id), k = ui.day;
  switch (a) {
    case "tap": if (t.kind === "count") setCount(t, k, cnt(t, k) >= t.target ? 0 : cnt(t, k) + 1); else setCount(t, k, doneOn(t, k) ? 0 : 1); render(); break;
    case "inc": setCount(t, k, cnt(t, k) + 1); render(); break;
    case "dec": setCount(t, k, cnt(t, k) - 1); render(); break;
    case "setv": { const holder = b; holder.outerHTML = `<input class="v num" id="qv" type="number" min="0" value="${cnt(t, k)}" style="width:64px;border:1px solid var(--line);background:var(--surface)" aria-label="Amount">`;
      const inp = document.getElementById("qv"); inp.focus(); inp.select();
      const commit = () => { setCount(t, k, parseFloat(inp.value) || 0); render() };
      inp.addEventListener("blur", commit); inp.addEventListener("keydown", e => { if (e.key === "Enter") inp.blur() }); break }
    case "open": openDetail(t); break;
    case "day": { const n = +b.dataset.n; ui.day = n === 0 ? keyOf(today()) : keyOf(addDays(fromKey(ui.day), n)); if (ui.day > keyOf(today())) ui.day = keyOf(today()); render(); break }
    case "try": ui.prompt = b.dataset.v; ui.draft = parsePrompt(b.dataset.v); render(); break;
    case "create": { const n = blankTracker(ui.draft); S.trackers.push(n); save(); ui.draft = null; ui.prompt = ""; render(); toast(`Added “${n.name}”`, "Edit", () => openEditor(n, false)); break }
    case "customize": { const n = blankTracker(ui.draft); ui.draft = null; ui.prompt = ""; openEditor(n, true); break }
    case "cancelp": ui.draft = null; ui.prompt = ""; render(); break;
    case "clearex": S.trackers.filter(x => x.example).forEach(x => delete S.log[x.id]); S.trackers = S.trackers.filter(x => !x.example); S.examples = false; save(); render(); toast("Examples removed"); break;
    case "toggledone": ui.doneOpen = !ui.doneOpen; render(); break;
    case "edit": openEditor(t, false); break;
    case "new": openEditor(blankTracker(), true); break;
    case "unarchive": t.archived = false; save(); render(); break;
    case "mv": { const L = active(), i = L.indexOf(t), j = i + +b.dataset.n; if (j < 0 || j >= L.length) break; const A = S.trackers.indexOf(L[i]), B = S.trackers.indexOf(L[j]); [S.trackers[A], S.trackers[B]] = [S.trackers[B], S.trackers[A]]; save(); render(); break }
    case "copysteps": { const u = location.origin + location.pathname + "?steps="; try { await navigator.clipboard.writeText(u); toast("Link copied") } catch { toast(u) } break }
    case "adv": ui.adv = !ui.adv; try { sessionStorage.setItem("tally.adv", ui.adv ? "1" : "") } catch { } render(); break;
    case "look": { let v = b.dataset.v; const k2 = b.dataset.k;
      if (["size", "radius"].includes(k2)) v = +v; if (["glass", "streaks"].includes(k2)) v = v === "true";
      if (k2 === "preset" && v === "custom" && S.settings.look.preset !== "custom") { const p = palette(); S.settings.look.custom = { bg: p[0], surface: p[1], fg: p[2], accent: S.settings.look.accent || p[3] } }
      S.settings.look[k2] = v; save(); applyTheme(); render(); break }
    case "resetlook": { const t = S.settings.look.title; S.settings.look = Object.assign(defaultLook(), { title: t }); S.settings.theme = "system"; save(); applyTheme(); render(); toast("Look reset"); break }
    case "rmphoto": bgImage = ""; try { localStorage.removeItem("tally.bgimg") } catch { } if (S.settings.look.bg === "image") S.settings.look.bg = "none"; save(); applyTheme(); render(); break;
    case "set": { let v = b.dataset.v; if (b.dataset.k === "weekStart") v = +v; S.settings[b.dataset.k] = v; save(); applyTheme(); render(); break }
    case "notify": {
      if (S.settings.notify && Notification.permission === "granted") { S.settings.notify = false; save(); render(); break }

      catch { toast("Notifications aren't available here. You'll still see reminders inside the app.") }
      break }
    case "install": if (deferredInstall) { deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => { }); deferredInstall = null; render() } break;
    case "export": { const txt = JSON.stringify(Object.assign({}, S, bgImage ? { bgimg: bgImage } : {})); $("#dataio").innerHTML = `<textarea class="data" id="exp" readonly>${esc(txt)}</textarea>`; const ta = $("#exp");
      try { await navigator.clipboard.writeText(txt); toast("Backup copied") } catch { ta.focus(); ta.select(); toast("Select all and copy the text above") } break }
    case "download": { try { const blob = new Blob([JSON.stringify(Object.assign({}, S, bgImage ? { bgimg: bgImage } : {}), null, 1)], { type: "application/json" }); const u = URL.createObjectURL(blob); const l = document.createElement("a"); l.href = u; l.download = `tally-backup-${keyOf(today())}.json`; document.body.appendChild(l); l.click(); l.remove(); setTimeout(() => URL.revokeObjectURL(u), 2000); toast("Backup file saved") } catch { toast("Saving files isn't allowed here. Use Copy backup instead.") } break }
    case "importbox": $("#dataio").innerHTML = `<textarea class="data" id="imp" placeholder="Paste a backup here, or pick a file below"></textarea><div class="row-btns" style="margin-top:8px"><button class="btn small primary" data-act="doimport">Restore</button><label class="btn small" style="display:inline-block">Choose file<input id="impf" type="file" accept=".json,application/json" hidden></label></div>`;

    case "doimport": try { const d = JSON.parse($("#imp").value); if (!Array.isArray(d.trackers) || typeof d.log !== "object") throw 0; if (d.bgimg) { bgImage = d.bgimg; store.set("tally.bgimg", bgImage) } delete d.bgimg; S = Object.assign(defaults(), d); fixSettings(); save(); applyTheme(); render(); toast("Backup restored") } catch { toast("That text isn't a Tally backup. Copy the whole backup and try again.") } break;
    case "reset": $("#dataio").innerHTML = `<div class="banner"><span>Erase all trackers and history on this device?</span><span class="row-btns"><button class="btn small danger" data-act="reset2">Erase</button><button class="btn small" data-act="noreset">Keep</button></span></div>`; break;
    case "noreset": $("#dataio").innerHTML = ""; break;
    case "reset2": S = defaults(); bgImage = ""; try { localStorage.removeItem("tally.bgimg") } catch { } save(); applyTheme(); render(); toast("Everything erased"); break;
  }

// ---------- reminders ----------
function checkReminders() {
  const now = new Date(), k = keyOf(now), hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  dueList(today()).forEach(t => {
    if (!t.reminder || t.reminder > hm || S.fired[t.id] === k || doneOn(t, k)) return;
    S.fired[t.id] = k; save();

}

// Steps import: opening ...?steps=8421 (optionally &date=2026-10-14) sets that day's step count,

function importSteps() {
  let q; try { q = new URLSearchParams(location.search) } catch { return }

  try { history.replaceState(null, "", location.pathname + location.hash) } catch { }
  if (!isFinite(n) || n < 0) { toast("That steps link had no number in it."); return }
  let t = active().find(x => x.kind === "count" && /^steps?$/i.test(x.unit)) || active().find(x => /\bsteps?\b/i.test(x.name));
  if (!t) { t = blankTracker({ name: "Steps", emoji: "🚶", color: COLORS[6], kind: "count", target: 10000, unit: "steps", category: "Health" }); S.trackers.push(t) }
  if (t.kind !== "count") { t.kind = "count"; t.target = 10000; t.unit = "steps" }
  (S.log[t.id] ||= {}); if (n) S.log[t.id][k] = n; else delete S.log[t.id][k];

// The open tab lives in the address (#settings etc.), so a refresh or the back button keeps you where you were.

}

{ let start = ui.tab !== "today" ? "" : location.hash.slice(1); if (new URLSearchParams(location.search).has("steps")) start = "today"; if (!TABS.includes(start)) { try { start = sessionStorage.getItem("tally.tab") || "" } catch { } }
