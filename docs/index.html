<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2E6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Welli">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Welli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one centered column (max 640px); sticky date header, prompt bar, today list; tab bar fixed to the bottom on phones, top row on wide screens. */
:root {
  --bg: #F3F5F1; --surface: #FFFFFF; --surface-2: #E8EDE7; --line: #D5DCD4;
  --fg: #16201B; --muted: #5C6962; --accent: #2E6B57; --accent-ink: #FFFFFF;
  --flame: #C9701C; --danger: #B83A3A; --shadow: 0 1px 2px rgba(20,32,27,.06), 0 6px 20px rgba(20,32,27,.06);
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --f-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E1311; --surface: #171E1B; --surface-2: #202925; --line: #2C3732;
  --fg: #E6ECE8; --muted: #93A199; --accent: #72C3A5; --accent-ink: #0E1311;
  --flame: #F0A24F; --danger: #F07A7A; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0E1311; --surface: #171E1B; --surface-2: #202925; --line: #2C3732;
  --fg: #E6ECE8; --muted: #93A199; --accent: #72C3A5; --accent-ink: #0E1311;
  --flame: #F0A24F; --danger: #F07A7A; --shadow: 0 1px 2px rgba(0,0,0,.3); color-scheme: dark }

* { box-sizing: border-box }
html, body { height: 100%; overscroll-behavior-y: none }
body { background: var(--bg); color: var(--fg); font: 15px/1.45 var(--f-body); -webkit-tap-highlight-color: transparent }
button, input, select, textarea { font: inherit; color: inherit }
button { cursor: pointer }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
h1, h2, h3 { font-family: var(--f-display); margin: 0; text-wrap: balance; letter-spacing: -.01em }
.num { font-variant-numeric: tabular-nums }

.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 112px }
@media (min-width: 760px) { .wrap { padding-block: 0 48px } }

/* tab bar */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; display: flex; justify-content: center; gap: 4px;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)) }
.tabs button { flex: 1; max-width: 140px; border: 0; background: none; padding: 6px 4px; border-radius: 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 600; color: var(--muted) }
.tabs button svg { width: 22px; height: 22px }
.tabs button[aria-current="true"] { color: var(--accent); background: var(--surface-2) }
.toprow { display: flex; justify-content: flex-end; padding-top: 12px }
.toprow + .head { padding-top: 6px }
.lvchip { margin-right: auto; display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: 999px; padding: 3px 12px 3px 3px; box-shadow: var(--shadow); max-width: 55% }
.lvchip b { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-size: 13px; flex: none }
.lvchip > span { display: grid; gap: 3px; min-width: 64px; text-align: left }
.lvchip em { font-style: normal; font-size: 12px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.lvchip .xpbar { height: 5px }
.fishtab .pond { height: 220px }
.fishtab .sp > h3 { display: none }
.fishtab .fishbook { grid-template-columns: repeat(4, 1fr) }
.tabs .me { display: none }
.toprow .me, .tabs .me { display: inline-flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 14px 4px 4px; font-weight: 600; font-size: 14px; color: var(--fg); box-shadow: var(--shadow); max-width: 220px }
.toprow .me.out, .tabs .me.out { padding: 7px 16px; background: var(--accent); color: var(--accent-ink); border-color: transparent }
.me svg { width: 16px; height: 16px; flex: none }
.me .avatar { width: 28px; height: 28px; font-size: 12px }
.tabs .me span, .toprow .me span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
.me .avatar { font-style: normal }
.tabs .me { display: none !important }
@media (min-width: 760px) {
  .tabs { position: sticky; top: env(safe-area-inset-top, 0px); bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-top: 8px; padding-bottom: 8px }
  .tabs button { grid-auto-flow: column; gap: 8px; font-size: 14px; padding: 8px 12px }
  .tabs button svg { width: 18px; height: 18px }
  .tabs .me { display: inline-flex !important; grid-auto-flow: unset; position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: 50%; transform: translateY(-50%) }
  .toprow { display: none }
  .toprow + .head { padding-top: 20px }
}
[dir="rtl"] .tabs .me { right: auto; left: max(16px, env(safe-area-inset-left, 0px)) }
.scrim.clear { background: transparent; align-items: flex-start; justify-content: flex-end }
.menu { margin: calc(56px + env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) 0; width: min(300px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18); padding: 6px; display: grid; gap: 2px }
.menu .mhead { display: flex; gap: 10px; align-items: center; padding: 10px 10px 12px; border-bottom: 1px solid var(--line); margin-bottom: 4px }
.menu .mhead b { display: block; font-weight: 700 }
.menu .mhead div span { display: block; font-size: 12px; color: var(--muted); overflow-wrap: anywhere }
.menu button { display: flex; align-items: center; gap: 10px; border: 0; background: none; border-radius: 10px; padding: 10px; font-weight: 600; text-align: start; width: 100% }
.menu button:hover { background: var(--surface-2) }
.menu button svg { width: 18px; height: 18px; flex: none; color: var(--muted) }
.menu button em { margin-inline-start: auto; font-style: normal; font-weight: 500; color: var(--muted); font-size: 13px }
.menu button.pri { color: var(--accent) }
.menu button.pri svg { color: var(--accent) }
.menu button.dan { color: var(--danger) }
.menu button.dan svg { color: var(--danger) }
.langs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; max-height: 60vh; overflow: auto }
.langs button { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 12px; text-align: start; font-weight: 600 }
.langs button[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); color: var(--accent) }

/* header */
.head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 20px 12px }
.head .eyebrow { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600 }
.head h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; line-height: 1.05 }
.daynav { display: flex; align-items: center; gap: 6px; margin-top: 6px }
.daynav button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 2px 10px; font-size: 13px; color: var(--muted) }
.ring { flex: none; position: relative; width: 72px; height: 72px }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg) }
.ring .lbl { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; font-weight: 700; font-size: 15px; line-height: 1.1 }
.ring .lbl small { display: block; font-weight: 500; font-size: 11px; color: var(--muted) }

/* prompt bar */
.prompt { display: flex; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 6px 6px 6px 14px; box-shadow: var(--shadow); align-items: center }
.prompt input { flex: 1; min-width: 0; border: 0; background: none; outline: none; padding: 8px 0; font-size: 16px }
.prompt .go { border: 0; background: var(--accent); color: var(--accent-ink); border-radius: 11px; padding: 9px 14px; font-weight: 700; white-space: nowrap }
.addbtn { width: 100%; display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line); background: var(--surface); color: var(--muted); border-radius: 16px; padding: 12px 14px; font: inherit; font-weight: 600; text-align: left; cursor: pointer }
.addbtn svg { width: 18px; height: 18px; color: var(--accent) }
.hint { font-size: 13px; color: var(--muted); margin: 8px 2px 0; display: flex; flex-wrap: wrap; gap: 6px; align-items: center }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 3px 10px; font-size: 13px; color: var(--fg) }
.preview { margin-top: 10px; background: var(--surface-2); border-radius: var(--r); padding: 12px 14px; display: grid; gap: 10px }
.preview .what { display: flex; gap: 10px; align-items: center; font-weight: 600 }
.preview .tags { display: flex; flex-wrap: wrap; gap: 6px }
.tag { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 6px; background: var(--surface); color: var(--muted) }
.row-btns { display: flex; gap: 8px; flex-wrap: wrap }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 8px 14px; font-weight: 600 }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent }
.btn.danger { color: var(--danger) }
.btn.small { padding: 5px 10px; font-size: 13px }

.banner { margin-top: 14px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 12px; font-size: 13px; color: var(--muted) }

/* list */
.sec { margin-top: 22px }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 0 2px 8px }
.sec-h h2 { font-size: 13px; font-family: var(--f-body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 700 }
.sec-h button { border: 0; background: none; color: var(--muted); font-size: 13px }
.list { display: grid; gap: 8px }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border-radius: var(--r); padding: 10px 12px; box-shadow: var(--shadow); border: 1px solid transparent }
.item.done { opacity: .62; box-shadow: none; border-color: var(--line); background: transparent }
.item.done .name { text-decoration: line-through; text-decoration-color: var(--muted) }
.check { width: 40px; height: 40px; border-radius: 50%; border: 2.5px solid var(--c); background: transparent; display: grid; place-items: center; position: relative; padding: 0; color: #fff }
.check svg { width: 20px; height: 20px; opacity: 0; transform: scale(.6); transition: .18s }
.check.on { background: var(--c) }
.check.on svg { opacity: 1; transform: none }
.check .pie { position: absolute; inset: -2.5px; border-radius: 50%; background: conic-gradient(var(--c) calc(var(--p) * 1turn), transparent 0); -webkit-mask: radial-gradient(circle, transparent 13px, #000 14px); mask: radial-gradient(circle, transparent 13px, #000 14px) }
.check .emo { font-size: 16px; line-height: 1; font-weight: 800; color: var(--c); font-family: var(--f-display) }
.body { min-width: 0; cursor: pointer }
.name { font-weight: 600; overflow-wrap: anywhere }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 12.5px; color: var(--muted); margin-top: 1px }
.meta .fl { color: var(--flame); font-weight: 700 }
.meta .fl, .meta .ic { display: inline-flex; align-items: center; gap: 3px }
.meta .fl svg, .meta .ic svg { width: 13px; height: 13px; flex: none }
.meta .late { color: var(--danger); font-weight: 600 }
.counter { display: flex; align-items: center; gap: 2px }
.counter button { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line); background: var(--surface); font-size: 18px; line-height: 1; font-weight: 600 }
.counter .v { min-width: 54px; text-align: center; font-weight: 700; font-size: 14px; border: 0; background: none; border-radius: 6px; padding: 4px 2px }
.counter .v small { display: block; font-weight: 500; font-size: 11px; color: var(--muted) }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; border: 1px dashed var(--line); border-radius: var(--r) }

/* stats */
.lvl { display: grid; grid-template-columns: auto auto 1fr auto; align-items: center; gap: 10px; width: 100%; border: 1px solid var(--line); background: var(--surface); color: inherit; border-radius: var(--r); padding: 8px 12px; margin: 0 0 12px; box-shadow: var(--shadow); font: inherit; text-align: start }
.lvl .lv { font-weight: 800; color: var(--accent) } .lvl .tt { font-weight: 600; font-size: 13px; color: var(--muted) } .lvl .xp { font-size: 12px; color: var(--muted) }
.xpbar { display: block; height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; min-width: 40px }
.xpbar i { display: block; height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), color-mix(in srgb, var(--accent) 60%, var(--flame))); transition: width .4s }
.xpbar.big { height: 10px; margin-top: 8px }
@media (max-width: 420px) { .lvl { grid-template-columns: auto 1fr auto } .lvl .tt { display: none } }
#game { scroll-margin-top: 90px }
.gtop { display: flex; gap: 14px; align-items: center }
.gl { width: 56px; height: 56px; flex: none; border-radius: 16px; display: grid; place-items: center; font-size: 26px; font-weight: 800; color: var(--accent-ink); background: var(--accent); font-family: var(--f-display) }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 8px }
.badge { display: grid; grid-template-columns: 30px 1fr; grid-template-rows: auto auto; column-gap: 8px; align-items: center; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; opacity: .45; filter: grayscale(1) }
.badge svg { width: 30px; height: 30px; grid-row: span 2; color: var(--muted) }
.badge b { font-size: 13px } .badge span { font-size: 11.5px; color: var(--muted); line-height: 1.3 }
.badge.on { opacity: 1; filter: none; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)) }
.badge.on svg { color: var(--flame) }
.xpfloat { position: fixed; z-index: 60; left: 50%; bottom: 120px; transform: translateX(-50%); background: var(--accent); color: var(--accent-ink); font-weight: 800; padding: 6px 14px; border-radius: 999px; box-shadow: var(--shadow); pointer-events: none; animation: xpup 1.4s ease-out forwards; zoom: var(--zoom, 1) }
@keyframes xpup { 0% { opacity: 0; transform: translate(-50%, 10px) } 15% { opacity: 1; transform: translate(-50%, 0) } 75% { opacity: 1 } 100% { opacity: 0; transform: translate(-50%, -30px) } }
@media (prefers-reduced-motion: reduce) { .xpfloat { animation: none } }
.side { display: none }
@media (min-width: 760px) {
  body.sides { --sw: 270px; --sl: calc(var(--sw) + 40px); --sr: calc(var(--sw) + 40px) }
  body.sides.snarrow { --sw: 224px }
  body.sides.snoleft { --sl: 0px }
  body.sides .side { display: block; position: fixed; top: 76px; bottom: 16px; width: var(--sw); overflow: auto; z-index: 5; zoom: var(--zoom, 1); scrollbar-width: thin }
  body.sides .sideL { left: 16px } body.sides .sideR { right: 16px }
  body.sides .side[hidden] { display: none }
  body.sides .wrap { max-width: min(640px, calc(100vw / var(--zoom, 1) - var(--sl) - var(--sr))); left: calc((var(--sl) - var(--sr)) / 2) }
  body.sides .wrap.wide { max-width: min(1040px, calc(100vw / var(--zoom, 1) - var(--sl) - var(--sr))) }
  body.sides .qadd { width: min(640px, calc(100% - var(--sl) - var(--sr) - 20px)); left: calc(50% + (var(--sl) - var(--sr)) / 2) }
}
.sheet ol.steps { padding-left: 20px; margin: 6px 0 14px; display: grid; gap: 10px; line-height: 1.4 }
.sheet ol.steps .line { margin-top: 6px }
.sp { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow); border: 1px solid var(--line) }
.small { font-size: 12.5px }
.sp .gl { width: 46px; height: 46px; font-size: 22px; border-radius: 13px }
.sbadges { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px }
.sbadge { display: flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 8px; font-size: 12px; font-weight: 600; opacity: .4; filter: grayscale(1); min-width: 0 }
.sbadge svg { width: 20px; height: 20px; flex: none; color: var(--muted) }
.sbadge span { line-height: 1.2; overflow-wrap: break-word; min-width: 0 }
body.snarrow .sbadges { grid-template-columns: 1fr; gap: 4px }
body.snarrow .sbadge { padding: 4px 8px }
.sbadge.on { opacity: 1; filter: none; background: color-mix(in srgb, var(--accent) 8%, var(--surface)); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)) }
.sbadge.on svg { color: var(--flame) }
.pond { position: relative; height: 150px; margin-top: 10px; border-radius: 12px; overflow: hidden; background: linear-gradient(#5aa6c9, #2f6f96 70%, #24597a) }
.pond .wave { position: absolute; left: -50%; width: 200%; height: 14px; border-radius: 50%; border-top: 2px solid rgba(255,255,255,.35); animation: wave 6s linear infinite }
.pond .w1 { top: 34px } .pond .w2 { top: 80px; animation-duration: 9s; opacity: .6 }
@keyframes wave { from { transform: translateX(0) } to { transform: translateX(25%) } }
.pond .swim { position: absolute; animation: swim 11s linear infinite } .pond .s1 { top: 92px } .pond .s2 { top: 118px; animation-duration: 15s; animation-delay: -6s }
@keyframes swim { from { left: -50px } to { left: 110% } }
.pond .bob { position: absolute; left: 50%; top: 52px; width: 14px; height: 18px; margin-left: -7px; opacity: 0; transition: opacity .2s }
.pond .bob i { display: block; width: 14px; height: 14px; border-radius: 50%; background: linear-gradient(#e94b3c 50%, #fff 50%); box-shadow: 0 2px 0 rgba(0,0,0,.25) }
.pond.cast .bob { opacity: 1; animation: bob 1.6s ease-in-out infinite }
.pond.bite .bob { animation: dip .25s ease-in-out infinite }
@keyframes bob { 50% { transform: translateY(3px) } } @keyframes dip { 50% { transform: translateY(9px) } }
.pond .bang { position: absolute; left: 50%; top: 18px; margin-left: 10px; font-weight: 900; font-size: 22px; color: #fff; opacity: 0; text-shadow: 0 2px 0 rgba(0,0,0,.3) }
.pond.bite .bang { opacity: 1 }
.pond .catch { position: absolute; inset: 0; display: grid; place-items: center; opacity: 0; transform: translateY(20px); transition: .3s }
.pond.caught .catch { opacity: 1; transform: none }
.frow { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 4px }
#fishmsg { min-height: 1.4em }
.fishbook { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px }
.fb { display: grid; justify-items: center; gap: 2px; border: 1px solid var(--line); border-radius: 10px; padding: 6px 4px; font-size: 11.5px; text-align: center }
.fb span { font-weight: 600 } .fb em { font-style: normal; color: var(--muted); font-size: 10.5px } .fb:not(.on) { opacity: .5 }
@media (prefers-reduced-motion: reduce) { .pond .wave, .pond .swim, .pond.cast .bob { animation: none } }
.daynote { width: 100%; resize: vertical; min-height: 64px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); color: inherit; padding: 10px 12px; font: inherit; box-shadow: var(--shadow) }
.wdbars { display: grid; gap: 6px; margin-top: 10px }
.wdb { display: grid; grid-template-columns: 44px 1fr 44px; align-items: center; gap: 8px; font-size: 13px }
.wdb .bar { height: 10px; border-radius: 999px; background: var(--surface-2); overflow: hidden }
.wdb .bar i { display: block; height: 100%; border-radius: 999px; background: var(--accent); opacity: .55 }
.wdb.best .bar i { opacity: 1 } .wdb.best .l, .wdb.best b { font-weight: 800; color: var(--accent) }
.wdb b { text-align: end; font-weight: 600 }
.notes { display: grid; gap: 6px; margin-top: 8px }
.note { display: grid; gap: 2px; text-align: start; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; color: inherit; font: inherit }
.note span:last-child { white-space: pre-wrap; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 6px }
@media (min-width: 560px) { .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)) } }
.tile { background: var(--surface); border-radius: var(--r); padding: 12px; box-shadow: var(--shadow) }
.tile b { display: block; font: 800 26px/1.1 var(--f-display) }
.tile span { font-size: 12px; color: var(--muted) }
.card { background: var(--surface); border-radius: var(--r); padding: 14px; box-shadow: var(--shadow) }

    layer.innerHTML = `<div class="scrim" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ach"><h2 id="ach">${tx("Sign in")}</h2><p class="muted">${tx("Accounts work in the Welli app at quxngle.github.io/Welli, not in this preview.")}</p><div class="row-btns"><button class="btn" data-ac="close">${tx("Close")}</button></div></div></div>`;

        <div class="card set" style="box-shadow:none;border:1px solid var(--line)"><div class="line"><span>${syncing ? tx("Syncing…") : ago == null ? tx("Not synced yet") : ago < 1 ? tx("Synced just now") : tx("Last synced {n} min ago", { n: ago })}</span><button class="btn small primary" data-ac="sync">${tx("Sync now")}</button></div>
        <div class="muted">${tx("Your trackers, history and settings are the same on every device where you sign in.")}</div></div>
        ${f.err || syncErr ? `<div class="err">${esc(f.err || syncErr)}</div>` : ""}
        <div class="row-btns" style="margin-top:16px;justify-content:space-between"><button class="btn" data-ac="close">${tx("Close")}</button><button class="btn danger" data-ac="signout">${tx("Sign out")}</button></div></div></div>`;
      return;
    }
    const up = f.mode === "signup";
    layer.innerHTML = `<div class="scrim" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ach">
      <h2 id="ach">${up ? tx("Create your account") : tx("Welcome back")}</h2>
      <div class="seg authtabs"><button data-ac="mode" data-v="signin" aria-pressed="${!up}">${tx("Sign in")}</button><button data-ac="mode" data-v="signup" aria-pressed="${up}">${tx("Create account")}</button></div>
      ${up ? `<p class="muted" style="margin-top:0">${tx("Make an account to keep your phone and computer in step. Everything already on this device comes with you.")}</p>` : ""}
      ${up ? input("name", tx("Your name"), "text", f.name, "name") : ""}
      ${input("email", tx("Email"), "email", f.email, "email")}
      <div class="field"><label for="a-pass">${tx("Password")}</label><div class="pw"><input id="a-pass" type="${f.show ? "text" : "password"}" value="${esc(f.pass)}" autocomplete="${up ? "new-password" : "current-password"}" style="padding-right:64px"><button data-ac="show" type="button">${f.show ? tx("Hide") : tx("Show")}</button></div></div>
      ${f.err ? `<div class="err" role="alert">${esc(f.err)}</div>` : ""}
      <div class="row-btns"><button class="btn primary" data-ac="go" ${f.busy ? "disabled" : ""}>${f.busy ? tx("One moment…") : up ? tx("Create account") : tx("Sign in")}</button><button class="btn" data-ac="close">${tx("Not now")}</button></div>
      <p class="muted">${tx("Welli is free to use without an account, but your data is then saved only on this device. Sign in to keep your trackers in sync across all your devices. You can use more than one account and switch between them at any time.")}</p></div></div>`;
    const first = document.getElementById(up ? "a-name" : "a-email"); if (first && !f[up ? "name" : "email"]) first.focus();

    if (a === "close") return closeSheet();

    if (a === "show") { f.show = !f.show; return draw() }
    if (a === "sync") { syncing = false; await syncNow(true); return draw() }
    if (a === "signout") { try { await sb.auth.signOut() } catch { } syncUser = null; healthCode = null; closeSheet(); toast(tx("Signed out. Your data stays on this device.")); return }
    if (a === "savename") {
      const name = f.name.trim(); if (!name) return;
      try { const r = await sb.auth.updateUser({ data: { name } }); if (r.error) throw r.error; syncUser = r.data.user; f.err = ""; toast(tx("Nice to meet you, {name}!", { name })) } catch (e) { f.err = e.message }
      return draw();
    }
    if (a === "go") {

      if (!/^\S+@\S+\.\S+$/.test(email)) { f.err = tx("That email doesn't look right."); return draw() }
      if (password.length < 6) { f.err = tx("Use a password with at least 6 characters."); return draw() }
      f.busy = true; f.err = ""; draw();
      try {
        await loadSupabase();
        const r = up ? await sb.auth.signUp({ email, password, options: { data: { name: f.name.trim() }, emailRedirectTo: location.origin + location.pathname } }) : await sb.auth.signInWithPassword({ email, password });
        if (r.error) throw r.error;
        if (up && !r.data.session) { f.busy = false; f.mode = "signin"; f.err = ""; draw(); toast(tx("Check your email to confirm your account, then sign in here.")); return }
        syncUser = r.data.user; syncErr = ""; closeSheet();
        toast(up ? tx("Welcome to Welli, {name}!", { name: userName() }) : tx("Welcome back, {name}!", { name: userName() }));
        await syncNow(); render();
      } catch (e) {
        f.busy = false;
        f.err = /invalid login/i.test(e.message) ? tx("That email and password don't match. Try again, or create an account.") : /already registered/i.test(e.message) ? tx("There's already an account with that email. Sign in instead.") : e.message;
        draw();
      }
    }
  };
}
function previewHTML(o) {

}

// ---------- calendar quick add ----------
// Reads lines like "wed 15 CS341 midterm 2 12:30 pm" or "Oct 20 dentist 3pm" into one-time events.
// It runs in the app (no AI service), so it works offline and costs nothing.
const MONTHS = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
const WDRE = "(sunday|monday|tuesday|wednesday|thursday|friday|saturday|sun|mon|tues?|wed|thu(?:rs?)?|fri|sat)\\.?";
const EVENT_EMOJI = [[/exam|midterm|final|quiz|\btest\b/i, "📝"], [/class|lecture|\blab\b|seminar|tutorial/i, "🏫"], [/assignment|homework|\bhw\b|project|essay|report|\bdue\b|deadline/i, "📌"], [/meeting|interview|\bcall\b/i, "👥"], [/dentist|doctor|appointment|clinic|hospital/i, "🩺"], [/birthday|bday/i, "🎂"], [/flight|trip|travel/i, "✈️"], [/party|dinner|lunch|brunch/i, "🍽️"]];
function nextDay(base, day) { for (let i = 0; i < 400; i++) { const d = addDays(base, i); if (d.getDate() === day) return d } return null }
function parseEvent(raw, base = today()) {
  let s = " " + raw.replace(/\s+/g, " ").trim() + " ";
  const cut = re => { const m = s.match(re); if (m) s = s.slice(0, m.index) + " " + s.slice(m.index + m[0].length); return m };
  let time = null, due = null, wantWd = -1, m;
  if ((m = cut(/\s(?:at\s+|@\s*)?(\d{1,2})(?::(\d{2}))?\s*(a\.?m\.?|p\.?m\.?)(?=[\s,.]|$)/i))) { let h = +m[1] % 12; if (/p/i.test(m[3])) h += 12; time = [h, +(m[2] || 0)] }
  else if ((m = cut(/\s(?:at\s+|@\s*)?([01]?\d|2[0-3])[:h]([0-5]\d)(?=[\s,.]|$)/i))) time = [+m[1], +m[2]];
  else if ((m = cut(/\s(?:at\s+)?noon(?=\s)/i))) time = [12, 0];
  else if ((m = cut(/\s(?:at\s+)?midnight(?=\s)/i))) time = [0, 0];
  if (time && (time[0] > 23 || time[1] > 59)) time = null;
  const mk = (y, mo, d) => { const x = new Date(y, mo, d); return x.getMonth() === mo ? x : null };
  const yearFor = (mo, d, y) => { if (y) return +(String(y).length === 2 ? "20" + y : y); const x = mk(base.getFullYear(), mo, d); return x && x < base ? base.getFullYear() + 1 : base.getFullYear() };
  if ((m = cut(/\s(?:on\s+|due\s+|by\s+)?(\d{4})-(\d{1,2})-(\d{1,2})(?=\s)/))) due = mk(+m[1], +m[2] - 1, +m[3]);
  else if ((m = cut(/\s(?:on\s+|due\s+|by\s+)?(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=[\s,.])/))) due = mk(yearFor(+m[1] - 1, +m[2], m[3]), +m[1] - 1, +m[2]);
  else if ((m = cut(new RegExp("\\s(?:on\\s+|due\\s+|by\\s+)?(?:" + WDRE + ",?\\s+)?(" + MONTHS.join("|") + ")[a-z]*\\.?\\s+(\\d{1,2})(?:st|nd|rd|th)?(?:,?\\s+(\\d{4}))?(?=[\\s,.])", "i")))) { const mo = MONTHS.indexOf(m[2].slice(0, 3).toLowerCase()); due = mk(yearFor(mo, +m[3], m[4]), mo, +m[3]) }
  else if ((m = cut(new RegExp("\\s(?:on\\s+|due\\s+|by\\s+)?(?:the\\s+)?(\\d{1,2})(?:st|nd|rd|th)?\\s+(?:of\\s+)?(" + MONTHS.join("|") + ")[a-z]*\\.?(?:,?\\s+(\\d{4}))?(?=[\\s,.])", "i")))) { const mo = MONTHS.indexOf(m[2].slice(0, 3).toLowerCase()); due = mk(yearFor(mo, +m[1], m[3]), mo, +m[1]) }
  else if ((m = cut(/\s(?:due\s+|by\s+)?(today|tonight|tomorrow|tmrw?|tmr)(?=[\s,.])/i))) due = addDays(base, /^to(day|night)$/i.test(m[1]) ? 0 : 1);
  else if ((m = cut(/\sin\s+(\d{1,3})\s+(days?|weeks?)(?=[\s,.])/i))) due = addDays(base, +m[1] * (/^w/i.test(m[2]) ? 7 : 1));
  else if ((m = cut(new RegExp("\\s(?:on\\s+|due\\s+|by\\s+)?(next\\s+|this\\s+)?" + WDRE + "(?:\\s+(?:the\\s+)?(\\d{1,2})(?:st|nd|rd|th)?)?(?=[\\s,.])", "i")))) {
    wantWd = ["sun", "mon", "tue", "wed", "thu", "fri", "sat"].indexOf(m[2].slice(0, 3).toLowerCase());
    if (m[3] && +m[3] >= 1 && +m[3] <= 31) due = nextDay(base, +m[3]);
    else { let n = (wantWd - base.getDay() + 7) % 7; if (/next/i.test(m[1] || "")) n += 7; due = addDays(base, n) }
  }
  else if ((m = cut(/\s(?:on\s+)?(?:the\s+)?(\d{1,2})(?:st|nd|rd|th)(?=[\s,.])/i))) due = nextDay(base, +m[1]);
  if (!due && time) due = base;
  let name = s.replace(/\s+/g, " ").trim().replace(/^(?:[-–,:]|on|at|by|due|for)\s+/i, "").replace(/\s+(?:[-–,:]|on|at|by|due|for)$/i, "").replace(/^[-–,:]+|[-–,:]+$/g, "").trim();
  const hm = time ? `${pad(time[0])}:${pad(time[1])}` : null;
  const emoji = (EVENT_EMOJI.find(([re]) => re.test(name)) || EMOJI.find(([re]) => re.test(name.toLowerCase())) || [, "📅"])[1];
  return { name, due: due ? keyOf(due) : null, time: hm, emoji, mismatch: due && wantWd >= 0 && due.getDay() !== wantWd };
}
window.parseEvent = parseEvent;
const quickLines = v => v.split(/\n|;/).map(x => x.trim()).filter(Boolean).map(x => parseEvent(x));
const REPEATS = [["once", "Once"], ["weekly", "Every week"], ["daily", "Every day"], ["weekdays", "Weekdays"]]; /* i18n: tx("Once") tx("Every week") tx("Every day") tx("Weekdays") */

  return ev.map(e => !e.name ? `<span class="qi bad">${tx("Add a name for the event")}</span>` : !e.due ? `<span class="qi bad">${esc(e.name)} · ${tx("add a date, like fri or Oct 20")}</span>`
    : `<span class="qi"><b>${esc(e.name)}</b> · ${esc(fmtDate(fromKey(e.due)))}${e.time ? " · " + fmtTime(e.time) : ""}${r !== "once" ? " · " + esc(repText(r, e.due)) : ""}${e.mismatch ? ` <span class="w">${tx("check the day")}</span>` : ""}</span>`).join("");
}
function addEvents(evs) {
  const r = ui.qrep || "once";
  const made = [];
  evs.forEach(e => made.push(S.trackers[S.trackers.push(blankTracker({ name: e.name, emoji: e.emoji,
    freq: r === "daily" ? "daily" : r === "once" ? "once" : "days", due: r === "once" ? e.due : null, days: r === "weekly" ? [fromKey(e.due).getDay()] : r === "weekdays" ? [1, 2, 3, 4, 5] : [],
    created: r === "once" ? keyOf(today()) : e.due, reminders: e.time ? [e.time] : [], cal: true })) - 1]));
  save();
  ui.calRef = evs[0].due;
  ui.qtext = ""; render(); const q = $("#qin"); if (q) q.focus();

  const msg = made.length === 1 ? tx("Added {name} on {date}", { name: m0.name, date: when }) : tx("Added {n} events", { n: made.length });
  toast(msg, tx("Undo"), () => { const ids = made.map(t => t.id); S.trackers = S.trackers.filter(t => !ids.includes(t.id)); save(); render() });
}
function quickSubmit(v) {
  if (!v.trim()) return;
  const ok = quickLines(v).filter(e => e.name && e.due);
  if (!ok.length) { $("#qprev").innerHTML = quickPreview(v); $("#qin").focus(); return }
  addEvents(ok);
}

// Tapping a day on the calendar opens this sheet: edit or delete what's on that day without leaving the calendar.
function openDaySheet(k, focusId) {
  const d = fromKey(k);
  let confirmId = null;
  const draw = () => {
    const l = dueList(d);
    layer.innerHTML = `<div class="scrim" data-act="closebg"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="dsh">
     <h2 id="dsh" style="margin:0 0 12px">${esc(d.toLocaleDateString(LOC, { weekday: "long", month: "long", day: "numeric" }))}</h2>
     ${l.length ? `<div class="dlist">${l.map(t => { const on = doneOn(t, k); return `<div class="drow ${t.id === focusId ? "focus" : ""}">
       <button class="dchk ${on ? "on" : ""}" style="--c:${t.color}" data-ds="tog" data-id="${t.id}" aria-pressed="${on}" aria-label="${tx("Done")}">${on ? "✓" : ini(t)}</button>
       <div class="body"><div class="name">${esc(t.name)}</div><div class="meta muted">${t.freq === "once" ? tx("One time") : esc(schedText(t))}${rems(t).length ? " · " + remText(t) : ""}</div></div>
       ${confirmId === t.id ? `<span class="row-btns"><button class="btn small danger" data-ds="del2" data-id="${t.id}">${tx("Delete")}</button><button class="btn small" data-ds="keep">${tx("Keep")}</button></span>`
         : `<button class="icon-btn" data-ds="edit" data-id="${t.id}" aria-label="${tx("Edit")}">${I.edit}</button><button class="icon-btn" data-ds="del" data-id="${t.id}" aria-label="${tx("Delete")}">${I.trash}</button>`}</div>` }).join("")}</div>
       ${confirmId && S.trackers.find(x => x.id === confirmId)?.freq !== "once" ? `<p class="muted" style="margin:8px 0 0">${tx("This repeats, so deleting removes every day of it.")}</p>` : ""}`
       : `<p class="muted">${tx("Nothing planned")}</p>`}
     <div class="row-btns" style="margin-top:16px"><button class="btn primary" data-ds="add">${tx("Add on this day")}</button><button class="btn" data-ds="open">${tx("Open day")}</button><button class="btn" data-ds="close">${tx("Close")}</button></div></div></div>`;
  };
  draw();
  layer.onkeydown = ev => { if (ev.key === "Escape") closeSheet() };
  layer.onclick = ev => {
    const b = ev.target.closest("[data-ds]");
    if (!b) { if (ev.target.dataset.act === "closebg") closeSheet(); return }
    const t = S.trackers.find(x => x.id === b.dataset.id), a = b.dataset.ds;
    if (a === "tog") { if (t.kind === "count") setCount(t, k, cnt(t, k) >= t.target ? 0 : t.target); else setCount(t, k, doneOn(t, k) ? 0 : 1); save(); draw() }
    else if (a === "edit") openEditor(t, false);
    else if (a === "del") { confirmId = t.id; draw() }
    else if (a === "keep") { confirmId = null; draw() }
    else if (a === "del2") { confirmId = null; removeTracker(t.id); draw() }
    else if (a === "add") openEditor(blankTracker({ freq: "once", due: k, emoji: "📅", cal: true }), true);
    else if (a === "open") { layer.innerHTML = ""; ui.day = k; goTab("today") }
    else closeSheet();
  };
}

// ---------- calendar ----------
function dayStats(d) {
  const k = keyOf(d), l = dueList(d), done = l.filter(t => doneOn(t, k)).length;
  return { l, k, done, pct: l.length ? done / l.length : 0 };
}
// English ordinal ending as a small raised suffix (1st, 2nd, 3rd); other languages just show the number.
const ORD = LANG => LANG === "en" ? new Intl.PluralRules("en", { type: "ordinal" }) : null;
function ordSuf(n) { const r = ORD(LANG); return r ? `<sup>${{ one: "st", two: "nd", few: "rd" }[r.select(n)] || "th"}</sup>` : "" }
function rCal() {
  const ref = fromKey(ui.calRef), ws = S.settings.weekStart, tk = keyOf(today());
  const dows = [0, 1, 2, 3, 4, 5, 6].map(i => DOW[(i + ws) % 7]);
  let title, body;

    const first = new Date(ref.getFullYear(), ref.getMonth(), 1), start = weekStart(first, ws);
    title = ref.toLocaleDateString(LOC, { month: "long", year: "numeric" });
    let cells = "";
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i); if (i >= 35 && d.getMonth() !== ref.getMonth()) break;
      const st = dayStats(d), future = st.k > tk, evs = st.l.filter(t => t.freq === "once" || t.cal).sort((a, b) => (rems(a)[0] || "99") < (rems(b)[0] || "99") ? -1 : 1);
      const fill = future ? 0 : st.pct;
      cells += `<button class="cell ${d.getMonth() !== ref.getMonth() ? "out" : ""} ${st.k === tk ? "today" : ""} ${fill === 1 && st.l.length ? "full" : ""}" data-act="calday" data-k="${st.k}" aria-label="${fmtDate(d)}: ${tx("{done} of {total} done", { done: st.done, total: st.l.length })}">
        <span class="fill" style="height:${Math.round(fill * 100)}%"></span><b class="num">${d.getDate()}${ordSuf(d.getDate())}</b>
        
        <span class="evs">${evs.slice(0, 9).map((t, i) => `<span class="${doneOn(t, st.k) ? "done" : ""}${i > 2 ? " x" : ""}" style="--c:${t.color}" title="${esc(t.name)}" data-act="calev" data-id="${t.id}" data-k="${st.k}">${rems(t)[0] ? `<em>${esc(fmtTime(rems(t)[0]))}</em> ` : ""}${esc(t.name)}</span>`).join("")}${evs.length > 3 ? `<em class="m3">+${evs.length - 3}</em>` : ""}${evs.length > 9 ? `<em class="m9">+${evs.length - 9}</em>` : ""}</span></button>`;
    }
    body = `<div class="month ds-${S.settings.look.done || "check"}" style="--rows:${Math.ceil(cells.split('class="cell').length - 1) / 7}">${dows.map(x => `<div class="dow">${x}</div>`).join("")}${cells}</div>
      <p class="muted">${tx("Each day fills up as you finish things. Tap a day to edit or delete what's on it.")}</p>`;
  } else {
    const start = weekStart(ref, ws);
    title = `${fmtShort(start)} – ${fmtShort(addDays(start, 6))}`;
    body = `<div class="weekv">${[0, 1, 2, 3, 4, 5, 6].map(i => {
